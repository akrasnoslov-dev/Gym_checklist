name: iOS macOS CI (authoritative)

on:
  pull_request:
    branches: [dev, main]
    # Run expensive macOS/Xcode verification only when a PR changes files
    # that can affect the iOS app build or its automated iOS tests.
    paths:
      - 'GymChecklist/**'
      - 'GymChecklistTests/**'
      - 'GymChecklistUITests/**'
      - 'GymChecklist.xcodeproj/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '**/*.xcconfig'
      - '**/*.entitlements'
      - 'GymChecklist/**/*.plist'
  workflow_dispatch:
    inputs:
      verification_scope:
        description: "Manual verification scope (pull requests use smoke unless title contains [full-ci])"
        required: true
        default: smoke
        type: choice
        options:
          - full
          - smoke
          - build
          - unit
          - ui
          - candidate
      test_filter:
        description: "Optional exact xcodebuild -only-testing filter for unit/ui diagnostics"
        required: false
        default: ""
        type: string
      candidate_source_sha:
        description: "Required 40-character source commit SHA for candidate verification"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Manual diagnostic/full runs must not cancel another manual run that is already
# producing useful evidence. Pull-request runs may replace obsolete PR work on the
# same ref. Normal pushes intentionally do not create macOS workflow runs.
concurrency:
  group: ios-macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Routine iOS-impacting pull requests use smoke by default; [full-ci]
      # in the PR title requests the full suite. Manual dispatch retains
      # every diagnostic scope, including authoritative full/candidate.
      VERIFICATION_SCOPE: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[full-ci]') && 'full' || 'smoke') || inputs.verification_scope }}
      TEST_FILTER: ${{ inputs.test_filter || '' }}
      CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha || '' }}

    steps:
      - name: Select Xcode 26.3
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch itself accepts only a branch or tag ref. Candidate
          # gates therefore receive and verify the immutable source commit here.
          ref: ${{ inputs.candidate_source_sha || github.sha }}
          fetch-depth: 1

      - name: Record Xcode version
        id: xcode
        shell: bash
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-swiftpm-${{ hashFiles('GymChecklist.xcodeproj/project.pbxproj', '**/Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-swiftpm-

      - name: Detect Xcode project
        id: detect
        shell: bash
        run: |
          PROJECT=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "project_found=false" >> "$GITHUB_OUTPUT"
            echo "No Xcode project exists yet. Bootstrap milestone has not completed."
          else
            echo "project_found=true" >> "$GITHUB_OUTPUT"
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bootstrap repository
        if: steps.detect.outputs.project_found == 'false'
        run: |
          test -f AGENTS.md
          test -f docs/product_spec.md
          test -f docs/implementation_plan.md
          test -f agents/routing.toml
          echo "Bootstrap repository validation passed."

      - name: Verify GymChecklist
        if: steps.detect.outputs.project_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.detect.outputs.project }}"
          SCHEME="GymChecklist"
          DESTINATION_UDID=$(python3 - <<'PY'
          import json
          import re
          import subprocess

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"iOS[- ](\d+)[-.](\d+)(?:[-.](\d+))?", runtime)
              if not match:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator was found")
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )
          echo "Using simulator UDID: $DESTINATION_UDID"
          PACKAGE_DIRECTORY="$RUNNER_TEMP/SourcePackages"
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          LOG_DIRECTORY="$RUNNER_TEMP/ci-logs"
          mkdir -p "$PACKAGE_DIRECTORY" "$DERIVED_DATA" "$LOG_DIRECTORY"

          if ! xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$PACKAGE_DIRECTORY" \
            > "$LOG_DIRECTORY/package-resolution.log" 2>&1; then
            echo "Swift package resolution failed; last 150 log lines:" >&2
            tail -n 150 "$LOG_DIRECTORY/package-resolution.log" >&2
            exit 1
          fi

          LOCKFILE="GymChecklist.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ ! -s "$LOCKFILE" ]; then
            echo "Required SwiftPM Package.resolved is missing or empty" >&2
            exit 1
          fi
          git ls-files --error-unmatch -- "$LOCKFILE" >/dev/null
          git diff --exit-code -- "$LOCKFILE"

          XCODE_ARGS=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -sdk iphonesimulator
            -destination "platform=iOS Simulator,id=$DESTINATION_UDID"
            -clonedSourcePackagesDirPath "$PACKAGE_DIRECTORY"
            -derivedDataPath "$DERIVED_DATA"
            -disableAutomaticPackageResolution
            CODE_SIGNING_ALLOWED=NO
          )

          run_xcodebuild() {
            local label="$1"
            shift
            local log="$LOG_DIRECTORY/$label.log"

            set +e
            xcodebuild "$@" > "$log" 2>&1
            local status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              {
                echo "xcodebuild failed: $label"
                echo
                grep -E "Test Case .* failed|Testing failed|error:|XCTAssert|failed -|Assertion|Expected|threw error" "$log" | tail -n 200 || true
              } > "$LOG_DIRECTORY/failure-summary.txt"
              cat "$LOG_DIRECTORY/failure-summary.txt"
              return "$status"
            fi

            echo "xcodebuild passed: $label"
          }

          case "$VERIFICATION_SCOPE" in
            candidate)
              if [ -z "$TEST_FILTER" ]; then
                echo "candidate scope requires an exact test_filter" >&2
                exit 2
              fi
              if ! [[ "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "candidate scope requires a 40-character lowercase candidate_source_sha" >&2
                exit 2
              fi
              test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
              case "$TEST_FILTER" in
                GymChecklistTests/*|GymChecklistUITests/*) ;;
                *)
                  echo "candidate test_filter must start with GymChecklistTests/ or GymChecklistUITests/" >&2
                  exit 2
                  ;;
              esac

              # Build exactly once. If the blocker test passes, immediately run
              # the full suite against the same build and candidate SHA.
              run_xcodebuild candidate-build "${XCODE_ARGS[@]}" build-for-testing
              run_xcodebuild candidate-focused "${XCODE_ARGS[@]}" test-without-building "-only-testing:$TEST_FILTER"
              run_xcodebuild candidate-full "${XCODE_ARGS[@]}" test-without-building
              ;;
            full)
              if [ -n "$TEST_FILTER" ]; then
                echo "test_filter is only valid for unit/ui/candidate diagnostics" >&2
                exit 2
              fi
              run_xcodebuild full "${XCODE_ARGS[@]}" test
              ;;
            smoke)
              if [ -n "$TEST_FILTER" ]; then
                echo "test_filter is only valid for unit/ui/candidate diagnostics" >&2
                exit 2
              fi
              run_xcodebuild smoke "${XCODE_ARGS[@]}" test \
                -only-testing:GymChecklistTests \
                -only-testing:GymChecklistUITests/GymChecklistUITests/testTodayCompletesAndUndoesSetWithoutLeavingTheScreen \
                -only-testing:GymChecklistUITests/GymChecklistUITests/testTodayLongPressEditsPlanThenActualWithoutLeavingToday \
                -only-testing:GymChecklistUITests/GymChecklistUITests/testTodayRestoresSkippedExerciseWithItsOriginalCompletionState \
                -only-testing:GymChecklistUITests/GymChecklistUITests/testProgramEditsCompletedHistoricalActualAndRetainsItAfterReopen \
                -only-testing:GymChecklistUITests/GymChecklistUITests/testWeightUnitUpdatesTodayAndProgramWithoutChangingStoredWorkout \
                -only-testing:GymChecklistUITests/GymChecklistUITests/testSuccessfulRegistrationRoutesDirectlyToTodayEmptyState \
                -only-testing:GymChecklistUITests/GymChecklistUITests/testCompletingEveryRequiredSetShowsDismissibleCompletionPopup
              ;;
            build)
              if [ -n "$TEST_FILTER" ]; then
                echo "test_filter is only valid for unit/ui/candidate diagnostics" >&2
                exit 2
              fi
              run_xcodebuild build "${XCODE_ARGS[@]}" build-for-testing
              ;;
            unit)
              if [ -n "$TEST_FILTER" ]; then
                case "$TEST_FILTER" in
                  GymChecklistTests/*) ;;
                  *)
                    echo "unit test_filter must start with GymChecklistTests/" >&2
                    exit 2
                    ;;
                esac
                run_xcodebuild unit-focused "${XCODE_ARGS[@]}" test "-only-testing:$TEST_FILTER"
              else
                run_xcodebuild unit "${XCODE_ARGS[@]}" test -only-testing:GymChecklistTests
              fi
              ;;
            ui)
              if [ -n "$TEST_FILTER" ]; then
                case "$TEST_FILTER" in
                  GymChecklistUITests/*) ;;
                  *)
                    echo "ui test_filter must start with GymChecklistUITests/" >&2
                    exit 2
                    ;;
                esac
                run_xcodebuild ui-focused "${XCODE_ARGS[@]}" test "-only-testing:$TEST_FILTER"
              else
                run_xcodebuild ui "${XCODE_ARGS[@]}" test -only-testing:GymChecklistUITests
              fi
              ;;
            *)
              echo "Unsupported verification scope: $VERIFICATION_SCOPE" >&2
              exit 2
              ;;
          esac

      - name: Capture Swift package lockfile
        if: always() && steps.detect.outputs.project_found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftpm-resolved-${{ github.run_id }}
          path: GymChecklist.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload CI diagnostics
        if: failure() && steps.detect.outputs.project_found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: ignore
          retention-days: 7
