version = 1
description = "Codex task routing rules for Gym Checklist iOS review subagents."

[defaults]
non_trivial_task_requires_agent_check = true
high_risk_skip_requires_written_reason = true
prefer_parallel_subagents_when_available = true

[[rules]]
id = "today_or_user_visible_ux"
description = "Today screen, workout interactions, navigation, accessibility, or user-visible workflow changes."
must_use = ["ios_ux_guardian", "product_spec_guardian"]
also_consider = ["test_ci_agent", "architecture_guardian"]
triggers = ["Today", "set row", "long press", "skip exercise", "completion popup", "navigation", "accessibility"]

[[rules]]
id = "architecture_or_cross_feature"
description = "Changes affecting multiple features, MVVM boundaries, shared models/services, or offline architecture."
must_use = ["architecture_guardian", "code_quality_agent", "test_ci_agent"]
also_consider = ["product_spec_guardian"]
triggers = ["shared model", "repository interface", "cross-feature", "refactor", "data flow", "offline architecture"]

[[rules]]
id = "firebase_or_persistence"
description = "Firestore schema, repositories, offline sync, Firebase configuration, or data integrity."
must_use = ["firebase_data_guardian", "security_privacy_agent", "test_ci_agent"]
also_consider = ["architecture_guardian"]
triggers = ["Firestore", "Firebase", "offline persistence", "security rules", "sync", "repository", "data migration"]

[[rules]]
id = "authentication_privacy"
description = "Authentication, account lifecycle, secrets, privacy, Google/Apple sign-in, or user isolation."
must_use = ["security_privacy_agent", "product_spec_guardian"]
also_consider = ["firebase_data_guardian", "release_appstore_agent", "test_ci_agent"]
triggers = ["authentication", "login", "password", "Google Sign-In", "Sign in with Apple", "account", "secret", "privacy"]

[[rules]]
id = "ci_testing"
description = "GitHub Actions, xcodebuild, tests, simulator destinations, CI failures."
must_use = ["test_ci_agent"]
also_consider = ["code_quality_agent", "release_appstore_agent"]
triggers = ["GitHub Actions", "xcodebuild", "unit test", "UI test", "CI", "simulator"]

[[rules]]
id = "testflight_release"
description = "Signing, provisioning, App Store Connect, TestFlight, versioning, or release workflow."
must_use = ["release_appstore_agent", "security_privacy_agent", "test_ci_agent"]
also_consider = ["architecture_guardian"]
triggers = ["TestFlight", "App Store", "signing", "provisioning", "archive", "IPA", "App Store Connect"]

[[rules]]
id = "broad_review"
description = "Broad repository review or MVP acceptance work."
must_use = ["product_spec_guardian", "architecture_guardian", "security_privacy_agent", "code_quality_agent", "test_ci_agent"]
also_consider = ["ios_ux_guardian", "firebase_data_guardian", "release_appstore_agent"]
triggers = ["repository review", "MVP acceptance", "release readiness", "implementation review", "unknown regression"]
